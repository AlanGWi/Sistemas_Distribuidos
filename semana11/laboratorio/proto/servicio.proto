// Contrato del servicio, semana 11. Dominio de referencia, inventario.
// El equipo reemplaza las operaciones y mensajes por los de su dominio.
//
// Reglas del contrato
//  1. Cada campo tiene un número. Ese número es lo que viaja por la red,
//     no el nombre. Un número usado no se reutiliza nunca.
//  2. Las operaciones que modifican estado llevan id_solicitud, la clave que
//     permite al servidor reconocer un reintento (semántica at-most-once).
//  3. Para agregar un campo nuevo se usa un número nuevo. Para eliminar uno
//     se marca como reserved.


syntax = "proto3";

package pagos.v1;

service Pagos {
  // Consulta de saldo: operacion de lectura
  rpc Saldo (SaldoSolicitud) returns (SaldoRespuesta);

  // Transferencia: modifica el estado y necesita id_solicitud
  rpc Transferir (TransferirSolicitud) returns (TransferirRespuesta);
}

message SaldoSolicitud {
  string cuenta = 1;
}

message SaldoRespuesta {
  string cuenta = 1;
  int64 saldo = 2;
}

message TransferirSolicitud {
  string id_solicitud = 1;
  string origen = 2;
  string destino = 3;
  int64 monto = 4;
}

message TransferirRespuesta {
  string origen = 1;
  int64 saldo_origen = 2;
  string destino = 3;
  int64 saldo_destino = 4;
}
